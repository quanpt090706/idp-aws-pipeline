name: TV1 Frontend (CI)

on:
  push:
    branches: ['feature/**']
    paths:
      - 'frontend/**'
      - '.github/workflows/tv1-frontend-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/tv1-frontend-check.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/auth.js
          node --check src/api.js
      - name: Test
        run: npm test
      - name: Build mock preview
        run: npm run build
